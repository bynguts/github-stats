name: Generate Stats Images

on:
  push:
    branches: 
      - master
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: |
        zig build

    - name: Checkout history branch
      run: |
        git config --global user.name "jstrieb/github-stats"
        git config --global user.email "github-stats[bot]@jstrieb.github.io"
        # Push generated files to the generated branch
        git pull
        git checkout generated || git checkout -b generated

    - name: Generate images
      run: |
        ./zig-out/bin/github-stats
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        # TODO: Remove this when they get their API working again
        # https://github.com/orgs/community/discussions/192970
        MAX_RETRIES: 5

    - name: Commit to the repo
      run: |
        git add .
        # Force the build to succeed, even if no files were changed
        git commit -m 'Update generated files' || true
        git push --set-upstream origin generated

    - name: Render pixel stats panel
      # Draws the numbers as a dithered panel matching the profile's boot log.
      # Runs outside the checkout so nothing lands on the generated branch.
      if: ${{ !cancelled() }}
      run: |
        theme="$RUNNER_TEMP/theme"
        mkdir -p "$theme/fonts"
        git show master:theme/render_card.py > "$theme/render_card.py"
        for f in Silkscreen-Regular Silkscreen-Bold; do
          curl -sfL --retry 5 --retry-all-errors --retry-delay 10 \
            -o "$theme/fonts/$f.ttf" "https://github.com/google/fonts/raw/main/ofl/silkscreen/$f.ttf"
        done
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow numpy
        "$RUNNER_TEMP/venv/bin/python" "$theme/render_card.py" overview.svg languages.svg "$RUNNER_TEMP/activity.png"

    - name: Publish images to profile repo
      # Mirror the images to a single-commit `stats` branch of the profile
      # repo, which the README loads them from.
      # Runs even if generation failed, so the last good images still publish.
      # The force-push replaces the branch, so a failed render must never
      # publish without activity.png: reuse the previous one, or skip.
      if: ${{ !cancelled() }}
      run: |
        set +x
        out="$(mktemp -d)"
        cp overview.svg languages.svg "$out/"
        prev="https://raw.githubusercontent.com/bynguts/bynguts/stats/activity.png"
        if [ -f "$RUNNER_TEMP/activity.png" ]; then
          cp "$RUNNER_TEMP/activity.png" "$out/"
        elif curl -sfL --retry 5 --retry-all-errors --retry-delay 10 -o "$out/activity.png" "$prev"; then
          echo "::warning::Render failed; republishing the previous activity.png"
        else
          echo "::warning::No activity.png available; leaving the stats branch untouched"
          exit 0
        fi
        cd "$out"
        git init -q -b stats
        git add .
        git commit -q -m 'Update generated stats images'
        git push -f "https://x-access-token:${ACCESS_TOKEN}@github.com/bynguts/bynguts.git" stats
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
